<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YT Downloader</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { background: #111; color: #fff; padding: 28px 36px; min-height: 100vh; font-size: 13px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #8a8a8a; margin-bottom: 20px; }
  .section { margin-bottom: 16px; }
  .section > label { display: block; font-size: 11px; color: #666; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  input, select { background: #0a0a0a; border: 1px solid #222; color: #fff; padding: 9px 11px; border-radius: 6px; outline: none; width: 100%; font-size: 13px; }
  select { cursor: pointer; }
  .row { display: flex; gap: 8px; }
  .row > input { flex: 1; }
  .btn { background: #fff; color: #000; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
  .btn:hover { opacity: 0.85; }
  .btn.sec { background: #222; color: #fff; border: 1px solid #333; }
  .btn.sec:hover { background: #333; }
  .btn.danger { background: #e74c3c; color: #fff; }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .progress-wrap { margin-top: 14px; background: #0a0a0a; border: 1px solid #222; border-radius: 6px; overflow: hidden; height: 24px; position: relative; }
  .progress-fill { height: 100%; background: #2ecc71; width: 0%; transition: width 0.15s ease; }
  .progress-text { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; color: #fff; mix-blend-mode: difference; }
  #log { margin-top: 12px; background: #0a0a0a; border: 1px solid #222; border-radius: 6px; padding: 10px; font-size: 11px; font-family: monospace; color: #8a8a8a; max-height: 140px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; display: none; }
  .check { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .check input { width: auto; }
  .check label { text-transform: none; color: #8a8a8a; font-size: 12px; }
  /* Folder picker modal */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal.open { display: flex; }
  .modal-box { background: #111; border: 1px solid #222; border-radius: 8px; width: 520px; max-width: 90vw; padding: 20px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .modal-head h3 { font-size: 15px; }
  .modal-head button { background: none; border: none; color: #8a8a8a; cursor: pointer; font-size: 18px; }
  .path-bar { background: #0a0a0a; border: 1px solid #222; border-radius: 6px; padding: 8px 10px; font-family: monospace; font-size: 11px; color: #8a8a8a; margin-bottom: 10px; word-break: break-all; }
  .dir-list { max-height: 300px; overflow-y: auto; border: 1px solid #222; border-radius: 6px; }
  .dir-item { padding: 9px 12px; cursor: pointer; border-bottom: 1px solid #1a1a1a; display: flex; gap: 8px; }
  .dir-item:last-child { border-bottom: none; }
  .dir-item:hover { background: #1a1a1a; }
  .dir-item .d { color: #666; }
  .drive-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .drive-row button { background: #1a1a1a; border: 1px solid #222; color: #fff; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; }
  .drive-row button:hover { background: #333; }
  .hint { color: #555; font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<h1>YT Downloader</h1>
<p class="sub">Descargá con yt-dlp</p>

<div class="section">
  <label>URL del video</label>
  <div class="row">
    <input id="url" placeholder="https://youtube.com/watch?v=..." />
    <button class="btn sec" onclick="fetchFormats()" id="fetchBtn" style="flex:0 0 auto">Cargar formatos</button>
  </div>
</div>

<div class="section">
  <label>Tipo</label>
  <select id="type" onchange="toggleType()">
    <option value="video">Video</option>
    <option value="audio">Solo Audio</option>
  </select>
</div>

<div class="section" id="formatSection">
  <label>Formato / Calidad</label>
  <select id="format"><option value="">Cargá una URL primero</option></select>
</div>

<div class="section" id="abrSection" style="display:none">
  <label>Calidad de audio (kbps)</label>
  <select id="abr">
    <option value="0">Mejor (original)</option>
    <option value="64K">64 kbps</option>
    <option value="128K" selected>128 kbps</option>
    <option value="192K">192 kbps</option>
    <option value="256K">256 kbps</option>
    <option value="320K">320 kbps</option>
  </select>
</div>

<div class="section">
  <label>Carpeta de descarga</label>
  <div class="row">
    <input id="outputDir" placeholder="Elegí una carpeta..." />
    <button class="btn sec" onclick="openPicker()" style="flex:0 0 auto">Elegir</button>
  </div>
  <div class="hint" id="dirHint"></div>
</div>

<div class="check">
  <input type="checkbox" id="embedThumb" checked />
  <label for="embedThumb">Incrustar miniatura</label>
</div>

<div class="btn-row">
  <button class="btn" onclick="startDownload()" id="dlBtn">Descargar</button>
  <button class="btn danger" onclick="cancelDownload()" id="cancelBtn" style="display:none">Cancelar</button>
</div>

<div id="progressArea" style="display:none">
  <div class="progress-wrap">
    <div class="progress-fill" id="progressFill"></div>
    <div class="progress-text" id="progressText">0%</div>
  </div>
</div>
<div id="log"></div>

<!-- Folder picker (server-side, for remote clients) -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">Elegir carpeta</h3>
      <button onclick="closePicker()">&times;</button>
    </div>
    <div class="path-bar" id="curPath">C:\</div>
    <div class="drive-row" id="drives"></div>
    <div class="dir-list" id="dirs"></div>
    <div style="display:flex; gap:8px; margin-top:14px">
      <button class="btn" style="flex:1" onclick="pickCurrent()">Usar esta carpeta</button>
      <button class="btn sec" onclick="closePicker()">Cancelar</button>
    </div>
  </div>
</div>

<script>
let currentFormats = [];
let downloadId = null;
let progressInterval = null;
let currentDir = "C:\\";
let isLocal = false;
const $ = (id) => document.getElementById(id);

// ---- Detect local vs remote client ----
fetch("/api/client-info").then(r => r.json()).then(info => {
  isLocal = info.local;
  $("dirHint").textContent = isLocal
    ? "Tu PC (el servidor corre en local). Elegí cualquier carpeta."
    : "Cliente en red: elegí una carpeta del servidor.";
});

function toggleType() {
  const t = $("type").value;
  $("abrSection").style.display = t === "audio" ? "block" : "none";
  updateFormatOptions();
}

function updateFormatOptions() {
  const sel = $("format");
  const type = $("type").value;
  sel.innerHTML = "";
  if (!currentFormats.length) {
    sel.innerHTML = '<option value="">Cargá una URL primero</option>';
    return;
  }
  const filtered = currentFormats.filter(f => {
    if (type === "audio") return f.acodec !== "none";
    return f.vcodec !== "none";
  });
  if (!filtered.length) {
    sel.innerHTML = '<option value="">Sin formatos disponibles</option>';
    return;
  }
  for (const f of filtered) {
    const opt = document.createElement("option");
    opt.value = f.id;
    const res = f.resolution || "";
    const size = f.filesize ? " (" + (f.filesize / 1024 / 1024).toFixed(1) + "MB)" : "";
    const note = f.formatNote ? " - " + f.formatNote : "";
    opt.textContent = `${f.id}: ${res} ${f.ext}${note}${size}`;
    sel.appendChild(opt);
  }
}

async function fetchFormats() {
  const url = $("url").value.trim();
  if (!url) { showLog("Pegá una URL"); return; }
  const btn = $("fetchBtn");
  btn.disabled = true;
  btn.textContent = "Cargando...";
  showLog("Obteniendo formatos...");
  try {
    const r = await fetch("/apps/yt-downloader/api/list-formats", {
      method: "POST",
      body: new URLSearchParams({ url }),
    });
    const d = await r.json();
    if (d.ok && d.formats) {
      currentFormats = d.formats;
      updateFormatOptions();
      showLog(`Formatos cargados: ${d.formats.length} disponibles`);
    } else {
      showLog("Error: " + (d.error || "desconocido"));
    }
  } catch (e) {
    showLog("Error de red: " + e.message);
  }
  btn.disabled = false;
  btn.textContent = "Cargar formatos";
}

// ---- Folder picker ----
function openPicker() {
  loadDir($("outputDir").value || "C:\\");
  $("modal").classList.add("open");
}

function closePicker() { $("modal").classList.remove("open"); }
function pickCurrent() { $("outputDir").value = currentDir; closePicker(); }

async function loadDir(path) {
  const r = await fetch("/api/browse?path=" + encodeURIComponent(path));
  const d = await r.json();
  currentDir = d.currentPath;
  $("curPath").textContent = currentDir;
  const drives = $("drives");
  drives.innerHTML = "";
  for (const drv of (d.drives || [])) {
    const b = document.createElement("button");
    b.textContent = drv;
    b.onclick = () => loadDir(drv);
    drives.appendChild(b);
  }
  const list = $("dirs");
  list.innerHTML = "";
  if (d.parent) {
    const it = document.createElement("div");
    it.className = "dir-item";
    it.innerHTML = '<span class="d">..</span> subir';
    it.onclick = () => loadDir(d.parent);
    list.appendChild(it);
  }
  for (const dir of d.dirs) {
    const it = document.createElement("div");
    it.className = "dir-item";
    it.innerHTML = '<span class="d">&#128193;</span>' + dir.name;
    it.onclick = () => loadDir(dir.path);
    list.appendChild(it);
  }
}

// ---- Download ----
async function startDownload() {
  const url = $("url").value.trim();
  if (!url) { showLog("Pegá una URL"); return; }
  const fmt = $("format").value;
  if (!fmt) { showLog("Seleccioná un formato"); return; }
  const outputDir = $("outputDir").value.trim();
  if (!outputDir) { showLog("Elegí una carpeta de descarga"); return; }
  const abr = $("abr").value;
  const embed = $("embedThumb").checked;

  $("dlBtn").disabled = true;
  $("progressArea").style.display = "block";
  $("cancelBtn").style.display = "inline-block";

  const body = new URLSearchParams({ url, formatId: fmt, outputDir, embedThumbnail: embed ? "1" : "" });
  if ($("type").value === "audio" && abr !== "0") body.set("audioBitrate", abr);

  showLog("Descargando...");
  try {
    const r = await fetch("/apps/yt-downloader/api/start-download", { method: "POST", body });
    const d = await r.json();
    if (d.ok) {
      downloadId = d.id;
      progressInterval = setInterval(() => pollProgress(d.id), 300);
    } else {
      showLog("Error: " + (d.error || "desconocido"));
      resetUI();
    }
  } catch (e) {
    showLog("Error de red: " + e.message);
    resetUI();
  }
}

async function pollProgress(id) {
  try {
    const r = await fetch("/apps/yt-downloader/api/progress/" + id);
    const d = await r.json();
    if (d.done) {
      clearInterval(progressInterval);
      progressInterval = null;
      if (d.error) showLog("Error: " + d.error);
      else { setProgress(100); showLog("Descarga completada."); }
      resetUI();
    } else {
      setProgress(d.pct || 0);
      if (d.line) showLog(d.line);
    }
  } catch {
    clearInterval(progressInterval);
    progressInterval = null;
    resetUI();
  }
}

async function cancelDownload() {
  if (!downloadId) return;
  await fetch("/apps/yt-downloader/api/cancel/" + downloadId, { method: "POST" });
  clearInterval(progressInterval);
  progressInterval = null;
  showLog("Cancelado.");
  resetUI();
}

function setProgress(pct) {
  $("progressFill").style.width = pct + "%";
  $("progressText").textContent = pct.toFixed(1) + "%";
}

function resetUI() {
  $("dlBtn").disabled = false;
  $("cancelBtn").style.display = "none";
  downloadId = null;
}

function showLog(msg) {
  const el = $("log");
  el.style.display = "block";
  el.textContent += msg + "\n";
  el.scrollTop = el.scrollHeight;
}
</script>
</body>
</html>
