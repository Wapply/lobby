<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Upscale</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { background: #111; color: #fff; padding: 28px 36px; min-height: 100vh; font-size: 13px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #8a8a8a; margin-bottom: 20px; }
  .section { margin-bottom: 16px; }
  .section > label { display: block; font-size: 11px; color: #666; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  select { background: #0a0a0a; border: 1px solid #222; color: #fff; padding: 9px 11px; border-radius: 6px; outline: none; width: 100%; font-size: 13px; cursor: pointer; }
  .btn { background: #fff; color: #000; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .drop { border: 1px dashed #333; border-radius: 8px; padding: 32px; text-align: center; cursor: pointer; transition: all 0.15s; }
  .drop:hover, .drop.drag { border-color: #fff; background: #1a1a1a; }
  .drop .icon { font-size: 28px; margin-bottom: 8px; color: #666; }
  .drop .name { font-weight: 600; color: #fff; }
  .drop .hint { color: #666; font-size: 11px; margin-top: 4px; }
  .scale-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .scale-btns button { background: #0a0a0a; border: 1px solid #222; color: #8a8a8a; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .scale-btns button.active { background: #fff; color: #000; border-color: #fff; }
  .status { margin-top: 14px; padding: 10px 14px; border-radius: 6px; font-size: 12px; display: none; }
  .status.ok { background: #0a1f0a; border: 1px solid #2ecc71; color: #2ecc71; display: block; }
  .status.err { background: #1f0a0a; border: 1px solid #e74c3c; color: #e74c3c; display: block; }
  .status.busy { background: #0a0a1f; border: 1px solid #555; color: #8a8a8a; display: block; }
  .hint { color: #555; font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<h1>Upscale</h1>
<p class="sub">Escalado de imágenes con IA · Real-ESRGAN</p>

<div class="section">
  <div class="drop" id="drop">
    <div class="icon">&#8593;</div>
    <div class="name" id="fileName">Elegí o arrastrá una imagen</div>
    <div class="hint">JPG · PNG · WEBP</div>
  </div>
  <input type="file" id="file" accept="image/*" style="display:none" />
</div>

<div class="section">
  <label>Factor de escala</label>
  <div class="scale-btns" id="scaleBtns">
    <button data-s="2">2x</button>
    <button data-s="3">3x</button>
    <button data-s="4" class="active">4x</button>
  </div>
</div>

<div class="section">
  <label>Modelo</label>
  <select id="model"></select>
</div>

<div class="section">
  <div class="hint" id="saveHint">Al terminar, la imagen se descargará a tu PC (carpeta de Descargas o diálogo "Guardar como").</div>
</div>

<button class="btn" id="goBtn" style="width:100%; margin-top:4px">Escalar imagen</button>
<div class="status" id="status"></div>

<script>
let selectedFile = null;
let scale = "4";

const $ = (id) => document.getElementById(id);

// ---- Preferences per browser (localStorage) ----
const PREF_KEY = "lobby.upscale.prefs";
function savePrefs() {
  try {
    localStorage.setItem(PREF_KEY, JSON.stringify({
      scale,
      model: $("model").value,
    }));
  } catch {}
}

// Load models, then restore preferences
fetch("/apps/upscale/api/models").then(r => r.json()).then(d => {
  const sel = $("model");
  sel.innerHTML = "";
  for (const m of d.models) {
    const o = document.createElement("option");
    o.value = m.id; o.textContent = m.name;
    sel.appendChild(o);
  }
  let p = {};
  try { p = JSON.parse(localStorage.getItem(PREF_KEY) || "{}"); } catch {}
  if (p.model) {
    const exists = [...sel.options].some(o => o.value === p.model);
    if (exists) sel.value = p.model;
  }
  if (p.scale) {
    scale = p.scale;
    document.querySelectorAll("#scaleBtns button").forEach(x => {
      x.classList.toggle("active", x.dataset.s === scale);
    });
  }
  sel.addEventListener("change", savePrefs);
});

fetch("/api/client-info").then(r => r.json()).then(info => {
  $("saveHint").textContent = info.local
    ? "Al terminar, la imagen se descargará a tu PC usando la carpeta de Descargas o el diálogo \"Guardar como\" de tu navegador."
    : "El servidor procesa la imagen y te la envía a tu PC; se guardará en tu carpeta de Descargas o con \"Guardar como\".";
}).catch(() => {});

const drop = $("drop");
const fileInput = $("file");
drop.onclick = () => fileInput.click();
fileInput.onchange = (e) => setFile(e.target.files[0]);
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("drag"); };
drop.ondragleave = () => drop.classList.remove("drag");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("drag"); setFile(e.dataTransfer.files[0]); };

function setFile(f) {
  if (!f) return;
  selectedFile = f;
  $("fileName").textContent = f.name;
}

document.querySelectorAll("#scaleBtns button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("#scaleBtns button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    scale = b.dataset.s;
    savePrefs();
  };
});

async function go() {
  const st = $("status");
  if (!selectedFile) {
    st.className = "status err"; st.textContent = "Elegí una imagen primero.";
    return;
  }
  $("goBtn").disabled = true;
  st.className = "status busy"; st.textContent = "Escalando... puede tardar.";
  const fd = new FormData();
  fd.append("image", selectedFile);
  fd.append("scale", scale);
  fd.append("model", $("model").value);
  try {
    const r = await fetch("/apps/upscale/api/upscale", { method: "POST", body: fd });
    const d = await r.json();
    if (d.ok && d.filename) {
      st.className = "status ok";
      st.textContent = "Listo. Iniciando descarga...";
      triggerBrowserDownload(d.filename, d.downloadName || d.filename);
    } else {
      st.className = "status err";
      st.textContent = "Error: " + (d.error || "desconocido");
    }
  } catch (e) {
    st.className = "status err";
    st.textContent = "Error de red: " + e.message;
  }
  $("goBtn").disabled = false;
}

function triggerBrowserDownload(filename, downloadName) {
  const a = document.createElement("a");
  a.href = "/apps/upscale/api/file/" + encodeURIComponent(filename);
  a.download = downloadName;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => a.remove(), 1000);
}

$("goBtn").onclick = go;
</script>
</body>
</html>
